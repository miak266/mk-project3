
$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json

type: command

name: used_cars_train
display_name: used-cars-price-training
version: "1"

description: Train Random Forest regression model for used-car price prediction

inputs:
  train_data:
    type: uri_folder

  test_data:
    type: uri_folder

  n_estimators:
    type: integer

  max_depth:
    type: integer

outputs:
  model_output:
    type: mlflow_model

code: ../../../data-science/src

environment: azureml:used-cars-train-env:3

command: >-
  python train.py
  --train_data ${{inputs.train_data}}
  --test_data ${{inputs.test_data}}
  --n_estimators ${{inputs.n_estimators}}
  --max_depth ${{inputs.max_depth}}
  --model_output ${{outputs.model_output}}
