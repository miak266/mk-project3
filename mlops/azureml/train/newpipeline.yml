
$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json

type: pipeline
display_name: machine-failure-training-pipeline
experiment_name: machine-failure-prediction
description: Machine failure prediction and hyperparameter tuning

inputs:
  raw_data:
    type: uri_file
    path: azureml:machine-failure-data@latest

outputs:
  train_data:
    type: uri_folder
  test_data:
    type: uri_folder

settings:
  default_datastore: azureml:workspaceblobstore
  default_compute: azureml:ml-training-cluster2
  continue_on_step_failure: false

jobs:
  prep_data:
    name: prep_data
    display_name: prepare-machine-data
    type: command
    code: ../../../data-science/src

    command: >-
      python prep.py
      --raw_data ${{inputs.raw_data}}
      --train_data ${{outputs.train_data}}
      --test_data ${{outputs.test_data}}

    environment: azureml:used-cars-train-env@latest

    inputs:
      raw_data: ${{parent.inputs.raw_data}}

    outputs:
      train_data: ${{parent.outputs.train_data}}
      test_data: ${{parent.outputs.test_data}}

  sweep_step:
    name: sweep_step
    display_name: tune-machine-failure-model
    type: sweep

    inputs:
      train_data: ${{parent.jobs.prep_data.outputs.train_data}}
      test_data: ${{parent.jobs.prep_data.outputs.test_data}}

    sampling_algorithm: random
    trial: ./train.yml

    search_space:
      n_estimators:
        type: choice
        values: [50, 100, 150, 200]

      max_depth:
        type: choice
        values: [5, 10, 15, 20]

    objective:
      goal: maximize
      primary_metric: F1

    limits:
      max_total_trials: 12
      max_concurrent_trials: 2
      timeout: 7200
