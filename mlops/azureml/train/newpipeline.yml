
$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json

type: pipeline
display_name: used-cars-training-pipeline
experiment_name: used-cars-price-prediction
description: Used cars price prediction training and hyperparameter tuning

inputs:
  raw_data:
    type: uri_file
    path: azureml:used-cars-data@latest

outputs:
  train_data:
    type: uri_folder
  test_data:
    type: uri_folder

settings:
  default_datastore: azureml:workspaceblobstore
  default_compute: azureml:cpu-cluster
  continue_on_step_failure: false

jobs:

  prep_data:
    name: prep_data
    display_name: prepare-data
    type: command
    code: ../../../data-science/src

    command: >-
      python prep.py
      --raw_data ${{inputs.raw_data}}
      --train_data ${{outputs.train_data}}
      --test_data ${{outputs.test_data}}

    environment: azureml:used-cars-train-env@latest

    inputs:
      raw_data: ${{parent.inputs.raw_data}}

    outputs:
      train_data: ${{parent.outputs.train_data}}
      test_data: ${{parent.outputs.test_data}}

  sweep_step:
    name: sweep_step
    display_name: hyperparameter-sweep
    type: sweep

    inputs:
      train_data: ${{parent.jobs.prep_data.outputs.train_data}}
      test_data: ${{parent.jobs.prep_data.outputs.test_data}}

    sampling_algorithm: random

    trial:
      code: ../../../data-science/src

      command: >-
        python train.py
        --train_data ${{inputs.train_data}}
        --test_data ${{inputs.test_data}}
        --n_estimators ${{search_space.n_estimators}}
        --max_depth ${{search_space.max_depth}}
        --model_output ${{outputs.model_output}}

      environment: azureml:used-cars-train-env@latest

    outputs:
      model_output:
        type: mlflow_model

    search_space:
      n_estimators:
        type: choice
        values: [10, 20, 30, 50]

      max_depth:
        type: choice
        values: [5, 10, 15, 20]

    objective:
      goal: minimize
      primary_metric: MSE

    limits:
      max_total_trials: 20
      max_concurrent_trials: 10
      timeout: 7200
